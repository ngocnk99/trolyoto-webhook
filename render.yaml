# Render Blueprint — deploy via "New + Blueprint" trên Render dashboard.
# Hoặc cấu hình thủ công Web Service với buildCommand + startCommand bên dưới.

services:
  - type: web
    name: trolyoto-fb-webhook
    runtime: node
    region: singapore # gần Việt Nam → latency thấp với FB datacenter
    plan: starter # $7/mo, always-on, không cold start. Free plan sleep sau 15p idle → KHÔNG khuyến nghị cho webhook.
    branch: main
    rootDir: fb-webhook-server # nếu deploy từ mono-repo. Nếu repo riêng, bỏ dòng này.
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Secrets — cấu hình thủ công trong dashboard sau khi deploy.
      # `sync: false` tránh leak vào blueprint công khai.
      - key: FB_PAGE_ACCESS_TOKEN
        sync: false
      - key: FB_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: FB_APP_SECRET
        sync: false
      - key: FACEBOOK_PAGE_ID
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_IMAGE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # ── Cache outbox consumer (src/cache/cache-outbox-cron.ts) ──────────
      # Đọc bảng cache_invalidation_outbox rồi gọi buyer /api/revalidate để
      # giá mới lên web ngay, thay vì chờ hết cache ISR 1 giờ.
      # Phải TRÙNG với REVALIDATE_SECRET trong env của project buyer trên
      # Vercel — lệch là buyer trả 401 và consumer retry vô ích.
      - key: REVALIDATE_SECRET
        sync: false
      - key: BUYER_ORIGIN
        value: https://trolyoto.com
      # Các biến dưới đây đều có mặc định hợp lý trong code, chỉ đặt khi cần
      # chỉnh: CACHE_OUTBOX_INTERVAL_MS (30000), CACHE_OUTBOX_BATCH (500),
      # CACHE_OUTBOX_QUIET_FROM (0), CACHE_OUTBOX_QUIET_TO (7).
